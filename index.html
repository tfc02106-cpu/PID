<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>PID 控制動態響應模擬器 (自動標示版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; font-size: 32px; color: #2c3e50; margin-bottom: 5px; }
        .sub-title { text-align: center; color: #7f8c8d; margin-bottom: 20px; }

        .controls { 
            display: flex; justify-content: space-around; background: #ecf0f1; 
            padding: 25px; border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; 
        }
        .control-group { text-align: center; margin: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 20px; }

        .input-stepper { display: flex; align-items: center; justify-content: center; background: white; border: 2px solid #bdc3c7; border-radius: 8px; overflow: hidden; }
        input[type="number"] { width: 70px; height: 50px; border: none; text-align: center; font-size: 22px; font-weight: bold; outline: none; -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .step-btn { width: 50px; height: 50px; background-color: #3498db; color: white; border: none; font-size: 24px; cursor: pointer; user-select: none; }
        .step-btn:active { background-color: #2980b9; }

        .metrics-panel {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
            background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-size: 18px;
        }
        .metric-val { color: #f1c40f; font-weight: bold; }

        #warningOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 0, 0, 0.9); z-index: 9999; color: white;
            text-align: center; justify-content: center; align-items: center;
            flex-direction: column; animation: flash 0.5s infinite;
        }
        @keyframes flash { 0%, 100% { background-color: rgba(255, 0, 0, 0.9); } 50% { background-color: rgba(150, 0, 0, 0.9); } }
    </style>
</head>
<body>

<div id="warningOverlay">
    <h1>⚠️ 系統失控 ⚠️</h1>
    <p>輸出數值過高或產生發散振盪！</p>
    <button onclick="hideWarning()" style="font-size: 24px; padding: 10px 40px; margin-top:20px; cursor:pointer;">重設參數</button>
</div>

<div class="container">
    <h2>PID 控制動態響應模擬器</h2>
    <div class="sub-title">自動標示 tr (上升時間), Mp (超越量), ts (穩定時間)</div>
    
    <div class="metrics-panel">
        <div>上升時間 (tr): <span id="m_tr" class="metric-val">--</span> s</div>
        <div>最大超越量 (Mp): <span id="m_mp" class="metric-val">--</span> %</div>
        <div>穩定時間 (ts): <span id="m_ts" class="metric-val">--</span> s</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Kp (比例)</label>
            <div class="input-stepper">
                <button class="step-btn" onclick="changeVal('kp', -0.1)">-</button>
                <input type="number" id="kp" value="1.5" step="0.1">
                <button class="step-btn" onclick="changeVal('kp', 0.1)">+</button>
            </div>
        </div>
        <div class="control-group">
            <label>Ki (積分)</label>
            <div class="input-stepper">
                <button class="step-btn" onclick="changeVal('ki', -0.05)">-</button>
                <input type="number" id="ki" value="0.2" step="0.05">
                <button class="step-btn" onclick="changeVal('ki', 0.05)">+</button>
            </div>
        </div>
        <div class="control-group">
            <label>Kd (微分)</label>
            <div class="input-stepper">
                <button class="step-btn" onclick="changeVal('kd', -0.1)">-</button>
                <input type="number" id="kd" value="0.5" step="0.1">
                <button class="step-btn" onclick="changeVal('kd', 0.1)">+</button>
            </div>
        </div>
        <div class="control-group">
            <label>目標值 (SP)</label>
            <div class="input-stepper">
                <button class="step-btn" onclick="changeVal('setpoint', -10)">-</button>
                <input type="number" id="setpoint" value="100">
                <button class="step-btn" onclick="changeVal('setpoint', 10)">+</button>
            </div>
        </div>
    </div>

    <canvas id="pidChart"></canvas>
</div>

<script>
let chart;

function changeVal(id, delta) {
    const input = document.getElementById(id);
    let newVal = (parseFloat(input.value) || 0) + delta;
    input.value = parseFloat(newVal.toFixed(2));
    updateSim();
}

function runSimulation() {
    const Kp = parseFloat(document.getElementById('kp').value) || 0;
    const Ki = parseFloat(document.getElementById('ki').value) || 0;
    const Kd = parseFloat(document.getElementById('kd').value) || 0;
    const Setpoint = parseFloat(document.getElementById('setpoint').value) || 1;

    const dt = 0.05, totalTime = 30; 
    let pv = 0, integral = 0, lastError = 0, velocity = 0;
    const mass = 1.0, friction = 0.5;
    
    const timeData = [], pvData = [], spData = [];
    let maxPV = 0, peakTime = 0;
    let t10 = -1, t90 = -1, ts = -1;

    for (let t = 0; t < totalTime; t += dt) {
        let error = Setpoint - pv;
        integral += error * dt;
        let derivative = (error - lastError) / dt;
        let output = (Kp * error) + (Ki * integral) + (Kd * derivative);
        
        let acceleration = (output - friction * velocity) / mass;
        velocity += acceleration * dt;
        pv += velocity * dt;
        lastError = error;

        timeData.push(t.toFixed(2));
        pvData.push(pv);
        spData.push(Setpoint);

        // 計算特徵點
        if (pv > maxPV) { maxPV = pv; peakTime = t; }
        if (t10 === -1 && pv >= Setpoint * 0.1) t10 = t;
        if (t90 === -1 && pv >= Setpoint * 0.9) t90 = t;
        
        // 穩定時間 (進入 5% 誤差帶且不再離開)
        if (Math.abs(Setpoint - pv) > Setpoint * 0.05) {
            ts = t;
        }
    }

    // 指標整理
    const tr = (t90 > t10 && t10 !== -1) ? (t90 - t10).toFixed(2) : "--";
    const Mp = maxPV > Setpoint ? (((maxPV - Setpoint) / Setpoint) * 100).toFixed(1) : "0";
    const finalTs = ts < (totalTime - 1) ? ts.toFixed(2) : "未穩定";

    document.getElementById('m_tr').innerText = tr;
    document.getElementById('m_mp').innerText = Mp;
    document.getElementById('m_ts').innerText = finalTs;

    let triggerWarning = maxPV > Setpoint * 2.5 || isNaN(pv);

    return { timeData, pvData, spData, triggerWarning, metrics: { t10, t90, peakTime, maxPV, ts: parseFloat(finalTs) } };
}

function updateSim() {
    const data = runSimulation();
    chart.data.labels = data.timeData;
    chart.data.datasets[0].data = data.pvData;
    chart.data.datasets[1].data = data.spData;
    
    // 清除舊的標註 (如有需要可在此擴充)
    chart.update();
    
    if (data.triggerWarning) document.getElementById('warningOverlay').style.display = 'flex';
}

function hideWarning() {
    document.getElementById('warningOverlay').style.display = 'none';
    document.getElementById('kp').value = 1.0;
    document.getElementById('ki').value = 0.1;
    document.getElementById('kd').value = 0.3;
    updateSim();
}

const ctx = document.getElementById('pidChart').getContext('2d');
const initRes = runSimulation();

chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: initRes.timeData,
        datasets: [
            { label: '實測輸出 (PV)', data: initRes.pvData, borderColor: '#3498db', borderWidth: 3, pointRadius: 0, fill: false, tension: 0.1 },
            { label: '目標值 (SP)', data: initRes.spData, borderColor: '#e74c3c', borderDash: [5, 5], borderWidth: 2, pointRadius: 0, fill: false }
        ]
    },
    options: {
        responsive: true,
        scales: {
            x: { title: { display: true, text: '時間 (Time, s)', font: { size: 16 } } },
            y: { title: { display: true, text: '數值 (Amplitude)', font: { size: 16 } }, min: 0 }
        },
        plugins: {
            legend: { position: 'top' },
            tooltip: { enabled: true }
        }
    }
});
</script>

</body>
</html>
