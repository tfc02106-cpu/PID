<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>PID 控制動態響應模擬器 (教學安全警告版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            margin: 20px; 
            background-color: #f4f7f6; 
            font-size: 18px; 
        }
        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            position: relative;
        }
        h2 { 
            color: #2c3e50; 
            text-align: center; 
            font-size: 32px; 
            margin-bottom: 30px;
        }
        .controls { 
            display: flex; 
            justify-content: space-around; 
            background: #ecf0f1; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
        }
        .control-group { text-align: center; }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #34495e; 
            font-size: 22px; 
        }
        input[type="number"] { 
            width: 120px; 
            padding: 10px; 
            border: 2px solid #bdc3c7; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold;
        }
        .math-box { 
            font-size: 20px; 
            color: #7f8c8d; 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }
        canvas { background: #fff; }

        /* --- 警報畫面樣式 --- */
        #warningOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 0, 0, 0.9);
            z-index: 9999;
            color: white;
            text-align: center;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: flash 0.5s infinite;
        }
        #warningOverlay h1 { font-size: 100px; margin: 0; text-shadow: 5px 5px #000; }
        #warningOverlay p { font-size: 40px; font-weight: bold; }

        @keyframes flash {
            0% { background-color: rgba(255, 0, 0, 0.9); }
            50% { background-color: rgba(150, 0, 0, 0.9); }
            100% { background-color: rgba(255, 0, 0, 0.9); }
        }
    </style>
</head>
<body>

<div id="warningOverlay">
    <h1>⚠️ 警告 ⚠️</h1>
    <p>系統嚴重失控，機台即將炸裂！</p>
    <button onclick="hideWarning()" style="font-size: 24px; padding: 10px 20px; cursor: pointer;">立即緊急停機並重設</button>
</div>

<div class="container">
    <h2>PID 控制動態響應模擬器</h2>
    
    <div class="controls">
        <div class="control-group">
            <label>Kp (比例)</label>
            <input type="number" id="kp" value="2" step="0.1" onchange="updateSim()">
        </div>
        <div class="control-group">
            <label>Ki (積分)</label>
            <input type="number" id="ki" value="1" step="0.1" onchange="updateSim()">
        </div>
        <div class="control-group">
            <label>Kd (微分)</label>
            <input type="number" id="kd" value="1" step="0.1" onchange="updateSim()">
        </div>
        <div class="control-group">
            <label>目標值 (Setpoint)</label>
            <input type="number" id="setpoint" value="100" onchange="updateSim()">
        </div>
    </div>

    <canvas id="pidChart"></canvas>

    <div class="math-box">
        公式提示：$u(t) = K_p e(t) + K_i \int e(t)dt + K_d \frac{de(t)}{dt}$
    </div>
</div>

<script>
let chart;

function runSimulation() {
    const Kp = parseFloat(document.getElementById('kp').value) || 0;
    const Ki = parseFloat(document.getElementById('ki').value) || 0;
    const Kd = parseFloat(document.getElementById('kd').value) || 0;
    const Setpoint = parseFloat(document.getElementById('setpoint').value) || 0;

    const dt = 0.1; 
    const totalTime = 50; 
    let pv = 0; 
    let integral = 0;
    let lastError = 0;
    
    const timeData = [];
    const pvData = [];
    const spData = [];
    
    let triggerWarning = false;

    let velocity = 0;
    const mass = 1.0;
    const friction = 0.1;

    for (let t = 0; t < totalTime; t += dt) {
        let error = Setpoint - pv;
        integral += error * dt;
        let derivative = (error - lastError) / dt;
        
        let output = (Kp * error) + (Ki * integral) + (Kd * derivative);
        
        let acceleration = (output - friction * velocity) / mass;
        velocity += acceleration * dt;
        pv += velocity * dt;

        lastError = error;

        timeData.push(t.toFixed(1));
        pvData.push(pv.toFixed(2));
        spData.push(Setpoint);

        // --- 警報判定條件 ---
        // 1. 數值超過 220
        if (pv > 220) {
            triggerWarning = true;
        }
        // 2. 40秒後震盪仍超過 120
        if (t >= 40 && pv > 120) {
            triggerWarning = true;
        }
    }

    return { timeData, pvData, spData, triggerWarning };
}

function updateSim() {
    const data = runSimulation();
    chart.data.labels = data.timeData;
    chart.data.datasets[0].data = data.pvData;
    chart.data.datasets[1].data = data.spData;
    chart.update();

    if (data.triggerWarning) {
        document.getElementById('warningOverlay').style.display = 'flex';
    }
}

function hideWarning() {
    document.getElementById('warningOverlay').style.display = 'none';
    // 重設為安全參數
    document.getElementById('kp').value = 0.6;
    document.getElementById('ki').value = 0.05;
    document.getElementById('kd').value = 0.5;
    updateSim();
}

const ctx = document.getElementById('pidChart').getContext('2d');
Chart.defaults.font.size = 16; 
const initData = runSimulation();

chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: initData.timeData,
        datasets: [{
            label: '實測輸出 (PV)',
            data: initData.pvData,
            borderColor: '#3498db',
            borderWidth: 3,
            pointRadius: 0,
            fill: false
        }, {
            label: '目標值 (Setpoint)',
            data: initData.spData,
            borderColor: '#e74c3c',
            borderDash: [5, 5],
            borderWidth: 2,
            pointRadius: 0,
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { labels: { font: { size: 18 } } } },
        scales: {
            x: { 
                title: { display: true, text: '時間 (s)', font: { size: 18, weight: 'bold' } },
                ticks: { font: { size: 14 } } 
            },
            y: { 
                title: { display: true, text: '數值', font: { size: 18, weight: 'bold' } },
                ticks: { font: { size: 14 } },
                min: 0 
            }
        },
        animation: { duration: 400 }
    }
});
</script>

</body>
</html>
